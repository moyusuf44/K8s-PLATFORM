apiVersion: apps/v1

kind: Deployment 

metadata:
  name: k8s-app
  labels:
    app: k8s-app  

spec:
  replicas: {{ .Values.replicaCount}}
  selector:
    matchLabels:
      app: k8s-app 

  template: 
    metadata:
      labels:
        app: k8s-app 

    spec: 
      containers:
        - name:  k8s-app 
          image: {{ .Values.image.repository}}:{{ .Values.image.tag}}
          ports:
          - containerPort: {{ .Values.service.port}} 